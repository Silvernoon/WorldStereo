[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldstereo-wam"
version = "0.1.0"
description = "WorldStereo WAM: Camera-guided video generation and 3D reconstruction via geometric memories"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0.0",
  "datasets>=3.0.0",
  "deepspeed>=0.14.0",
  "diffusers>=0.36.0",
  "einops>=0.8.0",
  "huggingface-hub>=0.29.0",
  "hydra-core>=1.3.0",
  "imageio[ffmpeg]>=2.30.0",
  "kornia>=0.7.0",
  "loguru>=0.7.0",
  "numpy>=1.26.0,<2.0.0",
  "omegaconf>=2.3.0",
  "opencv-python>=4.8.0",
  "packaging>=23.0",
  "peft>=0.10.0",
  "pillow>=10.0.0",
  "safetensors>=0.4.0",
  "scipy>=1.12.0",
  "termcolor>=2.4.0",
  "timm>=1.0.0",
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "tqdm>=4.66.0",
  "transformers>=4.40.0",
  "wandb>=0.16.0",
  "trimesh>=4.0.0",
  "plyfile>=1.0.0",
  "ftfy>=6.1.0",
  "regex>=2023.0.0",
  "matplotlib>=3.8.0",
  "decord>=0.6.0",
  "imagesize>=1.4.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["worldstereo_wam*"]
