# @package _global_
#
# WorldStereo training task: LIBERO 2-camera video generation at 224 resolution.
# Uses the FastWAM-style LeRobot data pipeline with WorldStereo's ControlNet model.

defaults:
  - override /data: libero_2cam
  - override /model: worldstereo
  - _self_

# dataloading
batch_size: 4
num_workers: 8

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
